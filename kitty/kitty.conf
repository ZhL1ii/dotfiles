
# 基础

shell /bin/zsh
confirm_os_window_close 0
enabled_layouts splits
scrollback_lines 10000


# 字体

# BEGIN_KITTY_FONTS
font_family family="Maple Mono NF CN" style="Light"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 15.0
# END_KITTY_FONTS

adjust_line_height 110%
adjust_column_width 100%


# macOS 窗口外观

# 隐藏标题栏，保留原生圆角
hide_window_decorations titlebar-only
macos_show_window_title_in none

# 单 Pane 保留圆角安全间距
single_window_margin_width 6
single_window_padding_width 10

# 多 Pane 使用紧凑间距
window_margin_width 0
window_padding_width 2

placement_strategy center


# 分屏边框

# 只绘制 Pane 之间的分隔线
draw_minimal_borders yes
draw_window_borders_for_single_window no
window_border_width 1px

active_border_color #888888
inactive_border_color #888888


# Tab 栏

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2
tab_title_max_length 24

# Tab 标题
shell_integration no-title
tab_title_template "{index}: {'ssh' if tab.active_exe.rsplit('/', 1)[-1] == 'ssh' else title}"


# 光标

cursor_shape block
cursor_shape_unfocused hollow

# 光标闪烁
cursor_blink_interval 0.43 ease-in-out
cursor_stop_blinking_after 0

# 光标拖尾
cursor_trail 5
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 1


# 快捷键：Tab 管理

# 新建 Tab，继承当前目录
map cmd+t launch --type=tab --cwd=current

# 关闭当前 Pane / 整个 Tab
map cmd+w close_window
map cmd+alt+w close_tab

# 切换指定 Tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9


# 快捷键：分屏管理

# 左右分屏
map cmd+shift+d launch --location=vsplit --cwd=current

# 上下分屏
map cmd+d launch --location=hsplit --cwd=current

# Pane 焦点切换
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
